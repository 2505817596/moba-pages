<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chapter09 · 1v1 对战</title>
    <style>
      :root { color-scheme:dark; font-family:Inter,"Microsoft YaHei",system-ui,sans-serif; background:#071018; color:#eef5ff; }
      * { box-sizing:border-box; }
      html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#071018; }
      button,input,select { font:inherit; color:#eef5ff; }
      button { cursor:pointer; }
      button:disabled { cursor:default; opacity:.45; }
      .battle-demo,.battle-arena { position:fixed; inset:0; width:100%; height:100dvh; overflow:hidden; background:#071018; }
      #battle-canvas { display:block; width:100%; height:100%; outline:0; touch-action:none; }
      .moba-hud { position:absolute; inset:0; z-index:5; pointer-events:none; }
      .moba-hud > * { pointer-events:auto; }
      .battle-status { position:absolute; z-index:7; top:max(12px,env(safe-area-inset-top)); left:50%; max-width:min(55vw,650px); margin:0; padding:7px 16px; transform:translateX(-50%); overflow:hidden; border:1px solid #5577a488; border-radius:999px; background:#071322d9; box-shadow:0 4px 16px #0006; color:#b9d9ff; font-size:12px; text-align:center; white-space:nowrap; text-overflow:ellipsis; pointer-events:none; }
      .scoreboard { position:absolute; z-index:6; top:max(52px,calc(env(safe-area-inset-top) + 50px)); left:50%; display:grid; grid-template-columns:70px 100px 70px; align-items:center; transform:translateX(-50%); overflow:hidden; border:1px solid #4d64848a; border-radius:8px; background:#07111dd9; box-shadow:0 5px 18px #0007; font-weight:800; text-align:center; }
      .scoreboard span { padding:7px 10px; }
      .score-blue { color:#7fc0ff; background:linear-gradient(90deg,#174774bb,#14253a44); }
      .score-red { color:#ff928c; background:linear-gradient(270deg,#74231fbb,#3a171544); }
      .battle-clock { color:#fff3c4; font-variant-numeric:tabular-nums; font-size:13px; }
      .fullscreen-button { position:absolute; z-index:9; top:max(12px,env(safe-area-inset-top)); right:max(14px,env(safe-area-inset-right)); min-width:62px; padding:8px 11px; border:1px solid #668bc5; border-radius:8px; background:#0b1730e8; box-shadow:0 4px 14px #0008; font-size:12px; }
      .battle-settings { position:absolute; z-index:8; top:max(12px,env(safe-area-inset-top)); left:max(14px,env(safe-area-inset-left)); width:min(320px,76vw); overflow:hidden; border:1px solid #39557d; border-radius:9px; background:#0b1423eb; box-shadow:0 5px 20px #0008; }
      .battle-settings summary { padding:9px 12px; cursor:pointer; color:#d7e5ff; font-size:13px; user-select:none; }
      .settings { display:grid; gap:8px; max-height:calc(100dvh - 70px); padding:2px 11px 12px; overflow-y:auto; overscroll-behavior:contain; }
      .settings label { display:grid; grid-template-columns:78px 1fr; align-items:center; gap:8px; color:#9eb1cf; font-size:12px; }
      .settings input,.settings select { min-width:0; padding:7px 8px; border:1px solid #405b83; border-radius:6px; background:#14243b; }
      .settings-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      .settings-actions button { padding:8px; border:1px solid #5478ac; border-radius:7px; background:#193961; }
      #cancel-match { border-color:#925b5b; background:#51272a; }
      .battle-metrics { margin:0; padding:9px; border-top:1px solid #314866; color:#b7c7df; font:11px/1.5 ui-monospace,Consolas,monospace; }
      .match-overlay { position:absolute; inset:0; z-index:6; display:grid; place-items:center; padding:20px; background:radial-gradient(circle at 50% 45%,#12243b22,#050b13a8); transition:opacity .2s ease; }
      .match-overlay.hidden { opacity:0; pointer-events:none; }
      .match-card { width:min(420px,90vw); padding:24px; border:1px solid #5d7ba888; border-radius:16px; background:linear-gradient(160deg,#0c1a2def,#08111eef); box-shadow:0 18px 70px #000b,inset 0 1px #ffffff12; text-align:center; }
      .match-card h1 { margin:0 0 7px; font-size:28px; letter-spacing:.08em; }
      .match-card p { margin:0 0 18px; color:#9fb4d3; font-size:13px; }
      .hero-choice { display:grid; margin-bottom:16px; }
      .hero-choice label { display:grid; gap:6px; color:#a9bad5; font-size:12px; text-align:left; }
      .hero-choice select { padding:10px; border:1px solid #5378ad; border-radius:8px; background:#132944; }
      .match-progress { display:none; gap:9px; margin:10px 0 16px; color:#cfe4ff; }
      .match-overlay.matching .match-progress { display:grid; }
      .match-dots { display:flex; justify-content:center; gap:7px; }
      .match-dots i { width:9px; height:9px; border-radius:50%; background:#6daeff; animation:pulse 1.2s infinite ease-in-out; }
      .match-dots i:nth-child(2) { animation-delay:.15s; }.match-dots i:nth-child(3) { animation-delay:.3s; }
      @keyframes pulse { 0%,70%,100%{opacity:.25;transform:scale(.8)} 35%{opacity:1;transform:scale(1.15)} }
      .match-buttons { display:grid; grid-template-columns:1fr auto; gap:10px; }
      .match-buttons button { min-height:46px; padding:10px 18px; border:1px solid #79a6e8; border-radius:9px; background:linear-gradient(#3475cf,#24569a); font-weight:800; }
      #start-local { border-color:#526784; background:#18283d; font-weight:600; }
      .rotate-hint { display:none; }
      @media(max-width:760px) { .scoreboard{top:max(48px,calc(env(safe-area-inset-top) + 46px));grid-template-columns:54px 80px 54px}.battle-status{max-width:48vw}.settings label{grid-template-columns:68px 1fr}.match-card{padding:18px}.match-card h1{font-size:23px} }
      @media(max-width:700px) and (orientation:portrait) { .battle-arena{filter:brightness(.35)}.rotate-hint{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#08101deb;color:#fff;font-size:22px;font-weight:800} }
    </style>
    <script type="module" crossorigin src="/moba-pages/assets/battle-DzVdnP_j.js"></script>
    <link rel="modulepreload" crossorigin href="/moba-pages/assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="/moba-pages/assets/main-B0ORTOlg.js">
    <link rel="modulepreload" crossorigin href="/moba-pages/assets/nativeXRFrame-CwfwtEd1.js">
    <link rel="modulepreload" crossorigin href="/moba-pages/assets/workerPool-CfMXSLnf.js">
    <link rel="stylesheet" crossorigin href="/moba-pages/assets/main-DhzQQKOL.css">
  </head>
  <body data-svelte-lobby="true">
    <div id="app"></div>
    <main class="battle-demo">
      <section id="arena" class="battle-arena" aria-label="Chapter09 Quantum 1v1 战场">
        <canvas id="battle-canvas" aria-label="Quantum 3D 战场"></canvas>
        <div class="moba-hud" aria-label="游戏操作界面">
          <button id="fullscreen" class="fullscreen-button" type="button">全屏</button>
        </div>
        <p id="status" class="battle-status">正在加载 Quantum WASM 和 3D 场景…</p>
        <div class="scoreboard" aria-label="比分"><span id="score-blue" class="score-blue">蓝 0</span><span id="battle-clock" class="battle-clock">00:00</span><span id="score-red" class="score-red">0 红</span></div>
        <details class="battle-settings">
          <summary>对局设置</summary>
          <section class="settings">
            <label>传输方式
              <select id="net10-transport">
                <option value="webtransport">WebTransport</option>
                <option value="websocket">WebSocket</option>
              </select>
            </label>
            <label>服务器地址 <input id="net10-endpoint" autocomplete="url" spellcheck="false" /></label>
            <label>房间号 <input id="net10-room" value="chapter09-room" autocomplete="off" /></label>
            <div class="settings-actions"><button id="settings-match" type="button">1v1 匹配</button><button id="cancel-match" type="button" disabled>取消</button></div>
          </section>
          <p id="metrics" class="battle-metrics"></p>
        </details>
        <section id="match-overlay" class="match-overlay hidden">
          <div class="match-card">
            <h1>峡谷 1v1</h1><p>Quantum · Net10 WebTransport · 15 Hz 确定性对战</p>
            <div class="hero-choice"><label>本地英雄<select id="local-hero"><option value="101">盖伦 (101)</option><option value="102">后羿 (102)</option><option value="103">锤石 (103)</option><option value="104">伊泽瑞尔 (104)</option></select></label></div>
            <div class="match-progress"><div class="match-dots"><i></i><i></i><i></i></div><span id="match-progress-text">正在寻找对手 1/2</span></div>
            <div class="match-buttons"><button id="start-match" type="button">开始 1v1 匹配</button><button id="start-local" type="button">本地练习</button></div>
          </div>
        </section>
      </section>
      <div class="rotate-hint">请横屏游玩</div>
    </main>
  </body>
</html>
